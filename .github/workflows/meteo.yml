name: Meteo Loreto

on:
  schedule:
    - cron: "0 8 * * *"   # 10:00 in Italia con ora legale (UTC+2)
    - cron: "0 9 * * *"   # 10:00 in Italia con ora solare (UTC+1)
  workflow_dispatch:       # avvio manuale dal tab Actions

permissions:
  contents: write          # necessario per fare il commit del CSV

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla ora italiana
        id: check
        run: |
          if [ "$(TZ=Europe/Rome date +%H)" = "10" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Scarica meteo
        if: steps.check.outputs.go == 'true'
        run: python fetch_weather.py

      - name: Commit del CSV
        if: steps.check.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meteo_loreto.csv
          git diff --staged --quiet || git commit -m "Aggiornamento meteo $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
